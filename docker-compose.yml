services:

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped


  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server --console-address ":9001" /data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

  valkey:
    image: valkey/valkey:latest
    container_name: valkey_server
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    command: valkey-server --requirepass "${SECURE_PASSWORD}"
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "$$SECURE_PASSWORD", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

  ui:
    build: ./ui/
    ports:
      - "4200:80"
    restart: unless-stopped

  api:
    build: ./api/
    ports:
      - "8080:8000"
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      DATABASE_URL: ${DATABASE_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./api/
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
      DATABASE_URL: ${DATABASE_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # Same Xet-hang risk as llm (see its comment) - this container also
      # downloads HF-hosted models (Whisper, Sortformer).
      HF_HUB_DISABLE_XET: "1"
    # Docker's embedded per-container DNS resolver ended up with no upstream
    # nameserver after a host reboot (a dockerd/NetworkManager boot-order
    # race - host's own /etc/resolv.conf was fine), breaking every external
    # download (HF Hub, NVIDIA NGC) with "Temporary failure in name
    # resolution". Can't restart the docker daemon itself without sudo, so
    # this points the container straight at public resolvers instead.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - hf_cache:/root/.cache/huggingface
      # Whisper and Sortformer cache under /root/.cache/huggingface (covered
      # above, persists fine across rebuilds). Titanet's from_pretrained()
      # call resolves through NeMo's older NGC-based downloader instead,
      # which caches under /root/.cache/torch/NeMo/ - a path this compose
      # file never mounted, so every worker rebuild silently re-downloaded
      # Titanet from scratch. This is the actual fix for "why does this need
      # internet" - true one-time downloads, not a real offline requirement.
      - nemo_cache:/root/.cache/torch
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [compute, utility]
    depends_on:
      valkey:
        condition: service_healthy
    command: ["celery", "-A", "celery_app", "worker", "--loglevel", "info", "--pool=solo"]
    restart: unless-stopped

  llm:
    image: vllm/vllm-openai:latest
    container_name: llm
    ports:
      - "8001:8000"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # vllm/vllm-openai's base image declares NVIDIA_REQUIRE_CUDA driver
      # ranges that top out in the mid-570s. This host's driver (595.84) is
      # newer and actually fine (NVIDIA drivers are backward-compatible),
      # but nvidia-container-toolkit enforces that declared range literally
      # and refuses to start otherwise - nvidia-smi still works (NVML-only,
      # unaffected) while the real CUDA init fails. This skips that check.
      NVIDIA_DISABLE_REQUIRE: "1"
      # The actual hang (misdiagnosed at first as a CUDA/attention-backend
      # issue, since "Using FlashAttention version 2" was the last log line
      # before going silent) was the model weight download itself: HF Hub's
      # newer "Xet" transfer protocol was wedging silently on this network,
      # confirmed via py-spy dump showing the process parked in xet_get.
      # This forces the plain HTTP download path instead.
      HF_HUB_DISABLE_XET: "1"
    # Same embedded-DNS-resolver issue as worker (see its comment) - this
    # container needs external DNS too (HF Hub).
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - hf_cache:/root/.cache/huggingface
    # gpu-memory-utilization is a fraction of the WHOLE card, not "whatever
    # is free" - vLLM has no idea the worker container is also on this GPU.
    # Kept low (0.35 of an 8GB card ~= 2.8GB) so it coexists with worker's
    # Whisper+Sortformer+Titanet (~2-3GB combined) instead of OOM-ing both.
    # AWQ (4-bit) quantized weights, not fp16, for the same reason - fp16
    # Qwen2.5-3B alone is ~6GB, which wouldn't leave room for anything else.
    command:
      - "--model"
      - "Qwen/Qwen2.5-3B-Instruct-AWQ"
      - "--quantization"
      - "awq"
      - "--gpu-memory-utilization"
      - "0.35"
      - "--max-model-len"
      - "4096"
      - "--dtype"
      - "float16"
      # Default (non-eager) mode captures CUDA graphs across ~50 batch sizes
      # plus FlashInfer/CUDE-DSL autotuning on first start - this hung
      # indefinitely on this host (very new driver, 595.84). Eager mode
      # skips all of that: slower per-token throughput, but this is an
      # occasional background summarization call, not high-throughput
      # serving, so reliability matters more here than raw speed.
      - "--enforce-eager"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [compute, utility]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/models', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 1800s
    restart: unless-stopped

volumes:
  pgdata:
  minio_data:
  valkey-data:
    driver: local
  hf_cache:
  nemo_cache: