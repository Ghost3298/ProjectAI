<div class="settings">
    <div class="settingGroup">
        <span class="groupLabel">Appearance</span>

        <button type="button" class="settingRow" (click)="toggleTheme()">
            <mat-icon>{{ theme() === 'dark' ? 'dark_mode' : 'light_mode' }}</mat-icon>
            <div class="rowText">
                <span class="rowTitle">Dark mode</span>
                <span class="rowSub">Switch between light and dark surfaces</span>
            </div>
            <span class="switch" [class.on]="theme() === 'dark'">
                <span class="knob"></span>
            </span>
        </button>
    </div>

    <div class="settingGroup">
        <span class="groupLabel">Time zone</span>

        <div class="settingRow">
            <mat-icon>schedule</mat-icon>
            <div class="rowText">
                <span class="rowTitle">Displayed time zone</span>
                <span class="rowSub">Some browsers (privacy-hardened setups especially) report UTC instead of your real time zone - set it manually if timestamps look off</span>
            </div>
            <select class="tzSelect" [value]="utcOffsetMinutes()" (change)="updateUtcOffset($any($event.target).value)">
                @for (option of timezoneOptions; track option.minutes) {
                    <option [value]="option.minutes">{{ option.label }}</option>
                }
            </select>
        </div>
    </div>
